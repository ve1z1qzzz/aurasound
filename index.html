<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Music - Professional Ambient Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root {
            --accent-rgb: 192, 192, 192;
            --accent: rgb(var(--accent-rgb));
            --glass: rgba(20, 20, 20, 0.85);
            --text: #ffffff;
            --bg: #050505;
            --glow-intensity: 0.8;
            --transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-theme {
            --bg: #e5e5e5;
            --glass: rgba(255, 255, 255, 0.85);
            --text: #1a1a1a;
            --glow-intensity: 1;
        }
        
        body.light-theme .logo {
            color: #333;
            text-shadow: 0 0 5px rgba(var(--accent-rgb), 0.3);
        }

        body.light-theme.scheme-silver { --accent-rgb: 80, 80, 80; }
        body.light-theme.scheme-midnight { --accent-rgb: 20, 60, 180; }
        body.light-theme.scheme-gold { --accent-rgb: 150, 110, 10; }

        body.scheme-silver { --accent-rgb: 192, 192, 192; }
        body.scheme-midnight { --accent-rgb: 100, 149, 237; }
        body.scheme-gold { --accent-rgb: 212, 175, 55; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            transition: background 0.8s, color 0.8s;
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; filter: blur(30px); opacity: 0.7; pointer-events: none;
        }

        .app-shell {
            position: relative;
            z-index: 1;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(var(--accent-rgb), 0.1);
            position: relative;
        }

        .logo {
            font-size: 20px; font-weight: 800; letter-spacing: 4px;
            text-align: center; margin-bottom: 50px; color: var(--accent);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(var(--accent-rgb), var(--glow-intensity));
            transition: color 0.3s;
        }

        .nav-container { position: relative; }
        .nav-item {
            padding: 16px 20px; border-radius: 16px; cursor: pointer;
            transition: 0.3s; color: var(--text); opacity: 0.5;
            margin-bottom: 8px; font-weight: 500; font-size: 17px;
            position: relative; z-index: 2;
            height: 52px; display: flex; align-items: center;
        }
        .nav-item.active { opacity: 1; }
        
        .nav-indicator {
            position: absolute;
            left: 0; width: 100%; height: 52px;
            background: rgba(var(--accent-rgb), 0.15);
            border-radius: 16px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            pointer-events: none;
            box-shadow: inset 0 0 10px rgba(var(--accent-rgb), 0.1);
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .page {
            display: none;
            width: 100%; height: 100%;
            animation: fadeIn 0.4s ease;
        }
        .page.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .player-hub {
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(30px);
            padding: 50px;
            border-radius: 50px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            border: 1px solid rgba(var(--accent-rgb), 0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .cover-container { width: 180px; height: 180px; margin: 0 auto 30px; position: relative; }
        .cover-art { width: 100%; height: 100%; border-radius: 30px; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.3); border: 1px solid rgba(var(--accent-rgb), 0.2); display: block; }
        .no-cover { width: 180px; height: 180px; border-radius: 30px; background: rgba(var(--accent-rgb), 0.1); border: 2px dashed rgba(var(--accent-rgb), 0.3); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .no-cover::after { content: ""; position: absolute; width: 140%; height: 2px; background: rgba(var(--accent-rgb), 0.3); transform: rotate(45deg); }

        .song-meta { width: 100%; overflow: hidden; margin-bottom: 25px; }
        .marquee-container { width: 100%; overflow: hidden; white-space: nowrap; position: relative; }
        .marquee-text { display: inline-block; will-change: transform; }
        .song-meta h1 { font-size: 28px; margin-bottom: 6px; }
        .song-meta p { opacity: 0.5; font-size: 16px; text-transform: lowercase; }

        @keyframes marquee { 0% { transform: translateX(0); } 10% { transform: translateX(0); } 90% { transform: translateX(calc(-100% + 200px)); } 100% { transform: translateX(0); } }

        .slider-base { width: 100%; height: 6px; background: rgba(var(--accent-rgb), 0.15); border-radius: 20px; cursor: pointer; position: relative; }
        .slider-fill { height: 100%; background: var(--accent); width: 0%; border-radius: 20px; transition: box-shadow 0.3s, background 0.3s; pointer-events: none; }
        .slider-base:hover .slider-fill, .slider-base.dragging .slider-fill { box-shadow: 0 0 20px rgba(var(--accent-rgb), var(--glow-intensity)); }

        .time-info { display: flex; justify-content: space-between; font-size: 12px; margin-top: 8px; opacity: 0.4; }
        .controls-row { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 25px 0; }

        .circle-btn { background: var(--accent); border: none; width: 65px; height: 65px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.4s; }
        .circle-btn:hover { box-shadow: 0 0 30px rgba(var(--accent-rgb), var(--glow-intensity)); }
        .circle-btn svg { fill: #2a2a2a; width: 22px; height: 22px; stroke: rgba(0,0,0,0.1); stroke-width: 0.5px; }

        .nav-btn { background: none; border: none; cursor: pointer; opacity: 0.4; transition: 0.3s; }
        .nav-btn:hover { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), var(--glow-intensity))); }
        .nav-btn svg { fill: var(--text); width: 28px; height: 28px; }
        
        .nav-btn.active-mode { opacity: 1 !important; transform: scale(1) !important; }
        .nav-btn.active-mode svg { fill: var(--accent) !important; filter: drop-shadow(0 0 15px rgba(var(--accent-rgb), 1)) !important; }

        body.light-theme .nav-btn.active-mode svg {
            filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.6)) !important;
        }

        .nav-btn.liked svg { fill: #ff4d4d; filter: drop-shadow(0 0 10px #ff4d4d); opacity: 1; }

        .volume-container { display: flex; align-items: center; gap: 15px; width: 160px; margin: 20px 0 0 0; }
        .volume-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .volume-icon:hover { transform: scale(1.1); opacity: 1; }
        .volume-icon svg { width: 100%; height: 100%; fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .scheme-picker { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .color-dot.active { border-color: var(--text); transform: scale(1.2); box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.5); }

        .fav-list { list-style: none; width: 100%; margin-top: 20px; padding: 0 30px; overflow-y: auto; max-height: 70vh; }
        .fav-item {
            background: var(--glass); padding: 0 20px; border-radius: 15px;
            margin-bottom: 12px; display: flex; align-items: center; border: 1px solid rgba(var(--accent-rgb), 0.1);
            cursor: pointer; position: relative; overflow: hidden; transition: 0.3s; height: 65px; width: 100%;
        }
        .fav-item:hover { border-color: rgba(var(--accent-rgb), 0.3); transform: translateY(-2px); }

        .cursor-glow {
            position: absolute; 
            width: 160px; height: 160px; 
            background: radial-gradient(circle, rgba(var(--accent-rgb), 0.4) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; 
            opacity: 0; 
            transition: opacity 0.15s ease; 
            z-index: 0;
            transform: translate(-50%, -50%);
            will-change: left, top;
        }
        .fav-item:hover .cursor-glow { opacity: 1; }

        #toast { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 8px 25px; border-radius: 50px; font-weight: 600; z-index: 1000; opacity: 0; transition: 0.5s; pointer-events: none; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="scheme-silver">

    <canvas id="bg-canvas"></canvas>

    <div class="app-shell">
        <audio id="audio" crossorigin="anonymous" src=""></audio>

        <nav class="sidebar">
            <div class="logo">Aura Music</div>
            <div class="nav-container">
                <div class="nav-indicator" id="nav-indicator"></div>
                <div class="nav-item active" data-page="home" data-index="0">Плеер</div>
                <div class="nav-item" data-page="library" data-index="1">Избранное</div>
                <div class="nav-item" data-page="settings" data-index="2">Настройки</div>
            </div>
        </nav>

        <main class="content">
            <div class="page active" id="home">
                <div class="player-hub">
                    <div id="toast">Готово</div>
                    <div class="cover-container" id="coverWrapper">
                        <div class="no-cover"></div>
                    </div>
                    <div class="song-meta">
                        <div class="marquee-container"><h1 id="title" class="marquee-text">Добавьте музыку</h1></div>
                        <div class="marquee-container"><p id="artist" class="marquee-text">чтобы начать прослушивание</p></div>
                    </div>
                    <div class="slider-base" id="progressTrack"><div class="slider-fill" id="progressFill"></div></div>
                    <div class="time-info"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
                    <div class="controls-row">
                        <button class="nav-btn" onclick="document.getElementById('fileInput').click()"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
                        <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;" onchange="handleMultipleFiles(event)">
                        <button class="nav-btn" id="shuffleBtn" onclick="toggleShuffle()"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.44l2.04 2.04V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                        <button class="nav-btn" onclick="playPrevious()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                        <button class="circle-btn" id="playBtn"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                        <button class="nav-btn" onclick="playNext()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                        <button class="nav-btn" id="repeatBtn" onclick="toggleRepeat()"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
                        <button class="nav-btn" id="likeBtn" onclick="toggleLike()"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
                    </div>
                    <div class="volume-container">
                        <div id="volSvg" class="volume-icon" onclick="toggleMute()"></div>
                        <div class="slider-base" id="volumeTrack" style="height: 5px;"><div class="slider-fill" id="volumeFill" style="width: 50%;"></div></div>
                    </div>
                </div>
            </div>

            <div class="page" id="library">
                <h1 style="margin: 40px;">Избранное</h1>
                <p id="empty-msg" style="text-align:center; opacity:0.5;">Список пуст</p>
                <ul class="fav-list" id="fav-list"></ul>
            </div>

            <div class="page" id="settings">
                <h1 style="margin: 40px;">Настройки</h1>
                <div style="padding: 30px; background: var(--glass); border-radius: 30px; width: 90%; max-width: 450px; text-align: center;">
                    <p style="margin-bottom: 20px; opacity: 0.7;">Цветовое свечение</p>
                    <div class="scheme-picker">
                        <div class="color-dot active" style="background: #c0c0c0;" onclick="setScheme('silver', this)"></div>
                        <div class="color-dot" style="background: #6495ED;" onclick="setScheme('midnight', this)"></div>
                        <div class="color-dot" style="background: #D4AF37;" onclick="setScheme('gold', this)"></div>
                    </div>
                    <hr style="opacity: 0.1; margin: 25px 0;">
                    <button id="themeToggleBtn" onclick="toggleTheme()" style="padding: 14px 30px; border-radius: 12px; border: none; background: var(--accent); color: var(--bg); font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(var(--accent-rgb), 0.3);">Светлая тема</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const toast = document.getElementById('toast');
        const coverWrapper = document.getElementById('coverWrapper');
        const likeBtn = document.getElementById('likeBtn');
        const volSvg = document.getElementById('volSvg');
        const themeBtn = document.getElementById('themeToggleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const navIndicator = document.getElementById('nav-indicator');

        audio.volume = 0.5;
        let lastVolume = 0.5;
        let favorites = [];
        let currentTrackData = { title: "Добавьте музыку", artist: "чтобы начать прослушивание", src: "", cover: "", id: null };
        let isPlaying = false;
        let isRepeating = false;
        let isShuffle = false;
        let shufflePool = [];
        let playbackHistory = [];

        let audioCtx, analyser, source, dataArray;
        function initAudioContext() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 128;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        function setupSlider(track, fill, onUpdate, onStart, onEnd) {
            let isDragging = false;
            const update = (e) => {
                const rect = track.getBoundingClientRect();
                const val = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                fill.style.width = (val * 100) + '%';
                onUpdate(val);
            };
            track.addEventListener('mousedown', (e) => {
                isDragging = true; track.classList.add('dragging');
                if(onStart) onStart(); update(e);
            });
            window.addEventListener('mousemove', (e) => { if(isDragging) update(e); });
            window.addEventListener('mouseup', () => { if(isDragging) { isDragging = false; track.classList.remove('dragging'); if(onEnd) onEnd(); } });
        }

        setupSlider(document.getElementById('progressTrack'), document.getElementById('progressFill'), (val) => { if(audio.duration) audio.currentTime = val * audio.duration; }, () => { audio.muted = true; }, () => { audio.muted = false; });
        setupSlider(document.getElementById('volumeTrack'), document.getElementById('volumeFill'), (val) => { audio.volume = val; if(val > 0) lastVolume = val; updateVolumeIcon(val); });

        function updateVolumeIcon(v) {
            let arcs = '';
            if (v > 0) arcs += '<path d="M14.5 9.5c0.8 1 0.8 4 0 5" />'; 
            if (v > 0.4) arcs += '<path d="M17 7.5c1.5 2 1.5 7 0 9" />';
            if (v > 0.7) arcs += '<path d="M19.5 5.5c2.5 3.5 2.5 9.5 0 13" />';
            volSvg.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none" />
                    ${v === 0 ? '<line x1="15" y1="9" x2="21" y2="15" /><line x1="21" y1="9" x2="15" y2="15" />' : arcs}
                </svg>`;
        }

        function toggleMute() {
            if(audio.volume > 0) { lastVolume = audio.volume; audio.volume = 0; } 
            else { audio.volume = lastVolume; }
            document.getElementById('volumeFill').style.width = (audio.volume * 100) + '%';
            updateVolumeIcon(audio.volume);
        }
        updateVolumeIcon(audio.volume);

        async function handleMultipleFiles(event) {
            initAudioContext();
            const files = Array.from(event.target.files);
            const startIdx = favorites.length;
            for (const file of files) {
                const fileURL = URL.createObjectURL(file);
                const track = { title: file.name.replace(/\.[^/.]+$/, ""), artist: "uploaded", src: fileURL, cover: "", id: Date.now() + Math.random() };
                await new Promise(r => jsmediatags.read(file, { onSuccess: t => {
                    if (t.tags.picture) {
                        const {data, format} = t.tags.picture;
                        let b64 = ""; for(let i=0; i<data.length; i++) b64 += String.fromCharCode(data[i]);
                        track.cover = "data:" + format + ";base64," + btoa(b64);
                    } r();
                }, onError: r }));
                favorites.push(track);
            }
            updateFavUI();
            if(!isPlaying && favorites.length > 0 && (currentTrackData.src === "" || currentTrackData.title === "Добавьте музыку")) loadTrack(startIdx);
        }

        function toggleLike() {
            if (currentTrackData.src === "") return;
            const idx = favorites.findIndex(t => t.src === currentTrackData.src);
            if (idx === -1) { favorites.unshift({...currentTrackData}); likeBtn.classList.add('liked'); showToast("Добавлено в избранное"); }
            else { favorites.splice(idx, 1); likeBtn.classList.remove('liked'); showToast("Удалено из избранного"); }
            updateFavUI();
        }

        function toggleRepeat() { isRepeating = !isRepeating; audio.loop = isRepeating; repeatBtn.classList.toggle('active-mode', isRepeating); showToast(isRepeating ? "Повтор включен" : "Повтор выключен"); }
        function toggleShuffle() { isShuffle = !isShuffle; shuffleBtn.classList.toggle('active-mode', isShuffle); if(isShuffle) shufflePool = []; showToast(isShuffle ? "Перемешивание включено" : "Перемешивание выключено"); }

        function playNext(saveToHistory = true) { 
            if (favorites.length === 0) return; 
            if(saveToHistory && currentTrackData.src !== "") playbackHistory.push(favorites.findIndex(t => t.src === currentTrackData.src));
            let idx;
            if (isShuffle) {
                if (shufflePool.length === 0) { shufflePool = favorites.map((_, i) => i); let curr = favorites.findIndex(t => t.src === currentTrackData.src); if(curr !== -1) shufflePool = shufflePool.filter(i => i !== curr); }
                const rnd = Math.floor(Math.random() * shufflePool.length); idx = shufflePool[rnd]; shufflePool.splice(rnd, 1);
            } else { idx = favorites.findIndex(t => t.src === currentTrackData.src); idx = (idx + 1) % favorites.length; }
            playTrack(idx); 
        }

        function playPrevious() { 
            if (favorites.length === 0) return; 
            if (audio.currentTime > 5) { audio.currentTime = 0; if(!isPlaying) { audio.play(); isPlaying = true; updatePlayIcon(); } } 
            else { if (playbackHistory.length > 0) playTrack(playbackHistory.pop(), false); else { let idx = favorites.findIndex(t => t.src === currentTrackData.src); idx = (idx - 1 + favorites.length) % favorites.length; playTrack(idx); } } 
        }

        audio.onended = () => { if(!isRepeating) playNext(); };

        function updateFavUI() {
            const list = document.getElementById('fav-list'); 
            list.innerHTML = '';
            document.getElementById('empty-msg').style.display = favorites.length ? 'none' : 'block';
            favorites.forEach((t, i) => {
                const li = document.createElement('li'); 
                li.className = 'fav-item';
                li.innerHTML = `
                    <div class="cursor-glow"></div>
                    <div style="display:flex;align-items:center;gap:12px;flex:1;justify-content:flex-start;position:relative;z-index:1;" onclick="playTrack(${i})">
                        ${t.cover ? `<img src="${t.cover}" style="width:38px;height:38px;border-radius:10px;object-fit:cover;">` : `<div style="width:38px;height:38px;background:rgba(var(--accent-rgb),0.1);border-radius:10px;"></div>`}
                        <div style="text-align:left">
                            <div style="font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;">${t.title}</div>
                            <div style="font-size:11px;opacity:0.5;text-transform:lowercase;">${t.artist}</div>
                        </div>
                    </div>
                    <button style="background:none;border:none;color:#ff4d4d;font-size:18px;cursor:pointer;margin-left:auto;padding:10px;position:relative;z-index:2;" 
                            onclick="event.stopPropagation();favorites.splice(${i},1);updateFavUI();checkLikeStatus()">✕</button>`;
                
                li.addEventListener('mousemove', (e) => {
                    const rect = li.getBoundingClientRect();
                    const glow = li.querySelector('.cursor-glow');
                    if (glow) {
                        glow.style.left = (e.clientX - rect.left) + 'px';
                        glow.style.top = (e.clientY - rect.top) + 'px';
                    }
                });
                list.appendChild(li);
            });
        }

        function loadTrack(i) {
            const t = favorites[i]; if(!t) return;
            currentTrackData = {...t}; 
            const titleEl = document.getElementById('title');
            const artistEl = document.getElementById('artist');
            titleEl.innerText = t.title; artistEl.innerText = t.artist;
            checkMarquee(titleEl); checkMarquee(artistEl);
            if (t.cover) coverWrapper.innerHTML = `<img src="${t.cover}" class="cover-art" alt="Cover">`; else coverWrapper.innerHTML = `<div class="no-cover"></div>`;
            audio.src = t.src; checkLikeStatus();
        }

        function checkMarquee(el) { const containerWidth = el.parentElement.offsetWidth; el.style.animation = 'none'; if (el.scrollWidth > containerWidth) { const duration = el.innerText.length * 0.25; el.style.animation = `marquee ${duration}s linear infinite`; } }
        function playTrack(i, saveToHistory = true) { if (favorites.length === 0) return; if(saveToHistory && currentTrackData.src !== "" && favorites[i].src !== currentTrackData.src) playbackHistory.push(favorites.findIndex(t => t.src === currentTrackData.src)); initAudioContext(); loadTrack(i); audio.play(); isPlaying = true; updatePlayIcon(); }
        function updatePlayIcon() { playIcon.innerHTML = isPlaying ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; }

        playBtn.onclick = () => { if (currentTrackData.src === "") return; initAudioContext(); if(audio.paused) { audio.play(); isPlaying = true; } else { audio.pause(); isPlaying = false; } updatePlayIcon(); };
        audio.ontimeupdate = () => { if (audio.duration && !document.getElementById('progressTrack').classList.contains('dragging')) { document.getElementById('progressFill').style.width = (audio.currentTime / audio.duration) * 100 + '%'; document.getElementById('curTime').innerText = formatTime(Math.floor(audio.currentTime)); document.getElementById('durTime').innerText = formatTime(Math.floor(audio.duration)); } };
        function formatTime(s) { let m = Math.floor(s/60); let sc = s%60; return `${m}:${sc<10?'0':''}${sc}`; }
        
        function setScheme(name, el) { document.body.className = `scheme-${name} ${document.body.classList.contains('light-theme') ? 'light-theme' : ''}`; document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active')); el.classList.add('active'); updateFavUI(); updateVolumeIcon(audio.volume); }
        function toggleTheme() { document.body.classList.toggle('light-theme'); themeBtn.innerText = document.body.classList.contains('light-theme') ? "Темная тема" : "Светлая тема"; updateFavUI(); updateVolumeIcon(audio.volume); }
        function showToast(text) { toast.innerText = text; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.onclick = () => {
                const idx = item.dataset.index; navIndicator.style.transform = `translateY(${idx * 60}px)`; 
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); item.classList.add('active');
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(item.dataset.page).classList.add('active');
            };
        });

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        let bars = new Array(32).fill(0);
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const accentColor = getComputedStyle(document.body).getPropertyValue('--accent');
            const isLight = document.body.classList.contains('light-theme');
            const barCount = 32; const bWidth = canvas.width / barCount;
            if (analyser && isPlaying) analyser.getByteFrequencyData(dataArray);
            for(let i=0; i < barCount; i++) {
                let val = (analyser && isPlaying) ? (dataArray[i] / 255) * canvas.height * 0.5 : 10;
                bars[i] += (val - bars[i]) * 0.1;
                ctx.shadowBlur = 40; ctx.shadowColor = accentColor;
                ctx.fillStyle = isLight ? "#111" : accentColor; ctx.globalAlpha = isLight ? 0.7 : 0.4;
                ctx.fillRect(i * bWidth + 5, canvas.height - bars[i], bWidth - 10, bars[i]); ctx.fillRect(i * bWidth + 5, 0, bWidth - 10, bars[i]); ctx.shadowBlur = 0;
            }
            requestAnimationFrame(draw);
        }
        draw();
        function checkLikeStatus() { const idx = favorites.findIndex(t => t.src === currentTrackData.src); likeBtn.classList.toggle('liked', idx !== -1); }
    </script>
</body>
</html>
