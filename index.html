<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Music - Professional Ambient Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root {
            --accent-rgb: 192, 192, 192;
            --accent: rgb(var(--accent-rgb));
            --glass: rgba(20, 20, 20, 0.85);
            --text: #ffffff;
            --bg: #050505;
            --glow-intensity: 0.8;
            --transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-theme {
            --bg: #e5e5e5;
            --glass: rgba(255, 255, 255, 0.85);
            --text: #1a1a1a;
            --glow-intensity: 1;
        }

        body.scheme-silver { --accent-rgb: 192, 192, 192; }
        body.scheme-midnight { --accent-rgb: 100, 149, 237; }
        body.scheme-gold { --accent-rgb: 212, 175, 55; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            transition: background 0.8s, color 0.8s;
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; filter: blur(30px); opacity: 0.7; pointer-events: none;
        }

        .app-shell { position: relative; z-index: 1; display: flex; height: 100vh; }

        .sidebar {
            width: 280px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px 25px;
            display: flex; flex-direction: column;
            border-right: 1px solid rgba(var(--accent-rgb), 0.1);
        }

        .nav-container { position: relative; }
        .nav-item {
            padding: 16px 20px; border-radius: 16px; cursor: pointer;
            transition: 0.3s; color: var(--text); opacity: 0.5;
            margin-bottom: 8px; font-weight: 500; font-size: 17px;
            position: relative; z-index: 2;
            height: 52px; display: flex; align-items: center;
        }
        
        /* Исправление 2: Анимация индикатора только если не мобилка */
        .nav-indicator {
            position: absolute;
            left: 0; width: 100%; height: 52px;
            background: rgba(var(--accent-rgb), 0.2);
            border-radius: 16px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1; pointer-events: none;
        }

        /* Исправление 1: Выделение цветом на телефоне */
        @media (max-width: 768px) {
            .nav-item.active {
                background: var(--accent) !important;
                color: #000 !important;
                opacity: 1;
            }
            .nav-indicator { display: none; } /* Убираем индикатор на мобилках */
            .sidebar { width: 100%; height: 80px; flex-direction: row; padding: 10px; position: fixed; bottom: 0; z-index: 100; border-right: none; border-top: 1px solid rgba(var(--accent-rgb), 0.1); }
            .logo { display: none; }
            .nav-container { display: flex; width: 100%; justify-content: space-around; }
            .nav-item { margin-bottom: 0; font-size: 14px; flex: 1; justify-content: center; }
            .content { padding-bottom: 80px; }
            
            /* Исправление 3: Скрываем звук и опускаем худ */
            .volume-container { display: none !important; }
            .controls-row { margin-top: 40px !important; }
        }

        .content { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .page { display: none; width: 100%; height: 100%; animation: fadeIn 0.4s ease; }
        .page.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .player-hub {
            background: var(--glass); backdrop-filter: blur(30px);
            padding: 50px; border-radius: 50px;
            width: 90%; max-width: 600px; text-align: center;
            border: 1px solid rgba(var(--accent-rgb), 0.1);
        }

        .song-meta h1 { font-size: 28px; margin-bottom: 6px; white-space: nowrap; }
        .song-meta p { opacity: 0.5; font-size: 16px; text-transform: lowercase; white-space: nowrap; }

        /* Исправление 4: Бегущая строка */
        .marquee-container { width: 100%; overflow: hidden; position: relative; }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .marquee-text { display: inline-block; padding-left: 0; }
        .is-scrolling { animation: marquee 10s linear infinite; display: inline-block; }

        .controls-row { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 25px 0; }
        .circle-btn { background: var(--accent); border: none; width: 65px; height: 65px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .nav-btn { background: none; border: none; cursor: pointer; opacity: 0.4; transition: 0.3s; }
        .nav-btn.active-mode svg { fill: var(--accent) !important; }

        /* Исправление 5: Сердечко на мобилке */
        @media (max-width: 768px) {
            .nav-btn.liked svg { 
                fill: #ff4d4d !important; 
                filter: drop-shadow(0 0 15px var(--accent)) !important; 
                opacity: 1;
            }
        }
        .nav-btn.liked svg { fill: #ff4d4d; opacity: 1; }

        /* Исправление 6: Избранное и крестик */
        .fav-item {
            background: var(--glass); padding: 0 15px; border-radius: 15px;
            margin-bottom: 12px; display: flex; align-items: center; 
            height: 70px; width: 100%; gap: 10px;
        }
        .fav-info { flex: 1; min-width: 0; text-align: left; }
        .fav-info div { 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; 
        }
        .del-btn { 
            background: none; border: none; color: #ff4d4d; 
            font-size: 24px; /* Больше крестик */
            cursor: pointer; padding: 10px; min-width: 45px;
        }

        #toast { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 25px; border-radius: 50px; opacity: 0; transition: 0.3s; z-index: 1000; }
        #toast.show { opacity: 1; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="scheme-silver">
    <canvas id="bg-canvas"></canvas>
    <div class="app-shell">
        <audio id="audio" crossorigin="anonymous"></audio>
        <nav class="sidebar">
            <div class="logo">Aura Music</div>
            <div class="nav-container">
                <div class="nav-indicator" id="nav-indicator"></div>
                <div class="nav-item active" data-page="home" data-index="0">Плеер</div>
                <div class="nav-item" data-page="library" data-index="1">Избранное</div>
                <div class="nav-item" data-page="settings" data-index="2">Настройки</div>
            </div>
        </nav>

        <main class="content">
            <div class="page active" id="home">
                <div class="player-hub">
                    <div id="toast">Готово</div>
                    <div class="song-meta">
                        <div class="marquee-container"><h1 id="title" class="marquee-text">Добавьте музыку</h1></div>
                        <div class="marquee-container"><p id="artist" class="marquee-text">чтобы начать</p></div>
                    </div>
                    <div class="controls-row">
                        <button class="nav-btn" onclick="document.getElementById('fileInput').click()"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg></button>
                        <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;" onchange="handleMultipleFiles(event)">
                        <button class="nav-btn" id="shuffleBtn" onclick="toggleShuffle()"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.44l2.04 2.04V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" fill="currentColor"/></svg></button>
                        <button class="circle-btn" id="playBtn"><svg id="playIcon" width="30" height="30" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                        <button class="nav-btn" id="likeBtn" onclick="toggleLike()"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="currentColor"/></svg></button>
                    </div>
                    <div class="volume-container" style="display: flex; align-items: center; gap: 10px; justify-content: center;">
                        <span style="font-size: 12px; opacity: 0.5;">VOL</span>
                        <input type="range" min="0" max="1" step="0.01" value="0.5" oninput="audio.volume = this.value" style="width: 100px;">
                    </div>
                </div>
            </div>

            <div class="page" id="library">
                <h1 style="margin-bottom: 20px;">Избранное</h1>
                <ul class="fav-list" id="fav-list" style="width: 90%; max-height: 70vh; overflow-y: auto;"></ul>
            </div>

            <div class="page" id="settings">
                <h1>Настройки</h1>
                <div class="scheme-picker" style="display:flex; gap:15px; margin: 20px;">
                    <div onclick="setScheme('silver')" style="width:30px; height:30px; background:#c0c0c0; border-radius:50%; cursor:pointer;"></div>
                    <div onclick="setScheme('midnight')" style="width:30px; height:30px; background:#6495ED; border-radius:50%; cursor:pointer;"></div>
                    <div onclick="setScheme('gold')" style="width:30px; height:30px; background:#D4AF37; border-radius:50%; cursor:pointer;"></div>
                </div>
                <button onclick="toggleTheme()" style="padding: 10px 20px; border-radius: 10px; border: none; background: var(--accent); color: #000;">Сменить тему</button>
            </div>
        </main>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const toast = document.getElementById('toast');
        let favorites = [];
        let currentTrack = null;

        // Исправление 4: Фильтрация ссылок
        function cleanText(text) {
            return text.replace(/(https?:\/\/)?(www\.)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/[^\s]*)?/g, "").trim();
        }

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Исправление 4: Логика бегущей строки
        function updateMarquee(el) {
            const container = el.parentElement;
            el.classList.remove('is-scrolling');
            el.innerHTML = cleanText(el.innerText);
            
            if (el.scrollWidth > container.offsetWidth) {
                const originalText = el.innerHTML;
                el.innerHTML = `<span>${originalText}</span><span style="margin-left:50px">${originalText}</span>`;
                el.classList.add('is-scrolling');
            }
        }

        async function handleMultipleFiles(event) {
            const files = Array.from(event.target.files);
            for (let file of files) {
                const track = {
                    id: Date.now() + Math.random(),
                    title: cleanText(file.name.replace(/\.[^/.]+$/, "")),
                    artist: "Local",
                    src: URL.createObjectURL(file)
                };
                favorites.push(track);
            }
            updateFavUI();
            if (!currentTrack && favorites.length > 0) playTrack(0);
        }

        function updateFavUI() {
            const list = document.getElementById('fav-list');
            list.innerHTML = '';
            favorites.forEach((t, i) => {
                const li = document.createElement('li');
                li.className = 'fav-item';
                li.innerHTML = `
                    <div class="fav-info" onclick="playTrack(${i})">
                        <div style="font-weight:600">${t.title}</div>
                        <div style="font-size:12px; opacity:0.6">${t.artist}</div>
                    </div>
                    <button class="del-btn" onclick="removeTrack(${i}, event)">✕</button>
                `;
                list.appendChild(li);
            });
        }

        // Исправление 7: Пауза при повторном клике в списке
        function playTrack(i) {
            const track = favorites[i];
            if (currentTrack && currentTrack.id === track.id) {
                if (!audio.paused) {
                    audio.pause();
                    showToast("Трек приостановлен");
                    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                } else {
                    audio.play();
                    playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                }
                return;
            }
            currentTrack = track;
            audio.src = track.src;
            document.getElementById('title').innerText = track.title;
            document.getElementById('artist').innerText = track.artist;
            updateMarquee(document.getElementById('title'));
            updateMarquee(document.getElementById('artist'));
            audio.play();
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }

        function removeTrack(i, e) {
            e.stopPropagation();
            favorites.splice(i, 1);
            updateFavUI();
        }

        function setScheme(name) {
            document.body.className = `scheme-${name} ${document.body.classList.contains('light-theme') ? 'light-theme' : ''}`;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        // Исправление 2: Навигация без "двоения"
        document.querySelectorAll('.nav-item').forEach(item => {
            item.onclick = () => {
                const isMobile = window.innerWidth <= 768;
                const idx = item.dataset.index;
                const indicator = document.getElementById('nav-indicator');
                
                if (!isMobile) {
                    indicator.style.transform = `translateY(${idx * 60}px)`;
                }

                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(item.dataset.page).classList.add('active');
            };
        });

        playBtn.onclick = () => {
            if (audio.paused) { audio.play(); playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }
            else { audio.pause(); playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; }
        };
    </script>
</body>
</html>
